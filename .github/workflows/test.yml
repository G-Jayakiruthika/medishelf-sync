# Runs on every push and pull request: checks every file for syntax errors, installs the site on a
# fresh MySQL database, then runs the SEO, API/security and browser tests. A red ✗ on GitHub means
# something broke; the deploy workflow will not run until this passes.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aushadhbox
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the security tests scan the whole git history for secrets

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, openssl, curl
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: PHP syntax check
        run: find public_html tools tests -name '*.php' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors' || true

      - name: Fail on PHP syntax errors
        run: "! find public_html tools tests -name '*.php' -print0 | xargs -0 -n1 php -l 2>&1 | grep -q 'Parse error'"

      - name: JavaScript syntax check
        run: for f in public_html/*.js tests/*.js; do node --check "$f"; done

      - name: Prescription and bill reader
        run: node tests/rx_parse_test.js

      - name: Bluetooth meter parsers
        run: node tests/ble_parse_test.js

      - name: Watch and health-app import
        run: node tests/health_import_test.js

      - name: Pharmacy analytics (Python)
        run: cd pharmacy-platform/analytics && python3 -m unittest discover -s tests -t .

      - name: Pharmacy network money rules and database upgrade
        run: |
          bash pharmacy-platform/tests/ci_setup.sh
          php pharmacy-platform/tests/unit_test.php
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root

      - name: Fridge thermometer logic (MicroPython, tested on CPython)
        run: cd pharmacy-platform/iot/coldchain && python3 -m unittest test_logic

      - name: Billing-software sync agent (Java)
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Build and test the sync agent
        run: sh pharmacy-platform/sync-agent/build.sh

      - name: 3D models are built from the shared description
        run: |
          python3 tools/models3d/spec.py && python3 tools/models3d/build_glb.py > /dev/null
          python3 -c "import ast; ast.parse(open('tools/models3d/blender_build.py').read())"
          cmp public_html/scene3d.js pharmacy-platform/public/lib/scene3d.js
          git diff --exit-code -- tools/models3d/models.json public_html/assets/3d pharmacy-platform/public/assets/3d || (echo "Run tools/models3d/spec.py and build_glb.py, then commit the models" && exit 1)

      - name: Pillbox simulator syntax
        run: python3 -m py_compile hardware/simulator/pillbox_sim.py

      - name: Cookie banner text is up to date
        run: |
          php tools/build_assets.php
          git diff --exit-code public_html/consent-i18n.js || (echo "Run: php tools/build_assets.php and commit consent-i18n.js" && exit 1)

      - name: Install a test copy of the site
        run: bash tests/ci_setup.sh
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root

      - name: SEO and site health checks
        run: php tests/seo_check.php http://127.0.0.1:8080

      - name: API and security tests
        run: bash tests/api_test.sh http://127.0.0.1:8080

      - name: Autopilot, support sorting and safety checks
        run: php tests/autopilot_test.php

      - name: Security tests (headers, sessions, two-factor, isolation, injection, privacy rights, backups, git history)
        run: bash tests/security_test.sh http://127.0.0.1:8080
        env:
          DB_CMD: mysql -h127.0.0.1 -uroot -proot aushadhbox

      - name: Load test (smoke, 20 families for 10 seconds)
        run: |
          php tests/load_seed.php 20
          python3 tests/load_test.py http://127.0.0.1:8080 --users 20 --seconds 10
          php tests/load_seed.php clean

      - name: Browser tests (phone and desktop)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests/e2e.js http://127.0.0.1:8080

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/aushadhbox-server.log || true
