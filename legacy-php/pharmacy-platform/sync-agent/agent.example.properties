# AushadhBox Pharmacy sync agent settings. Copy to sync.properties next to aushadhbox-sync.jar and fill in.
# The token is secret: anyone with it can change this shop's stock. Make it in the portal:
#   Stock -> Billing software sync -> New token. Revoke it there if this computer is lost.

server=https://pharmacy.aushadhbox.in
token=abs_paste_the_48_character_token_here_00000000000000

# Folder where your billing software saves the closing-stock export, and which files to send.
#   Marg ERP: Reports -> Stock -> Batch-wise Stock -> Export to Excel/CSV (schedule it hourly)
#   GoFrugal / Medeil: Stock report -> Export CSV
#   Tally: Stock Summary -> Export -> CSV (UTF-16 is handled)
folder=C:\\MargExports
pattern=*.csv

# true  = the export is the COMPLETE stock: anything not in it is set to 0 at this shop
# false = the export only lists some items (e.g. today's changes)
full=true

# How often to look for a new export (seconds, at least 60) and how long a file must be unchanged before sending.
intervalSeconds=300
settleSeconds=10
